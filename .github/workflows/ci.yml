name: Revisión automática

# Se ejecuta en cada Pull Request y en cada cambio de main:
# comprueba el código (lint), las pruebas automáticas y que la web compile antes de poder fusionarse.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
